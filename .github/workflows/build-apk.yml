name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Organize files
        run: |
          mkdir -p www assets
          if [ -f index.html ]; then mv index.html www/index.html; fi
          if [ -f splash.jpg ]; then mv splash.jpg www/splash.jpg; fi
          for f in icon-only icon-foreground icon-background splash splash-dark; do
            if [ -f "$f.png" ]; then mv "$f.png" "assets/$f.png"; fi
          done
          if [ -f capacitor_config.json ] && [ ! -f capacitor.config.json ]; then
            mv capacitor_config.json capacitor.config.json
          fi
          echo "--- repo files ---"
          ls -R www assets
          ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons and splash
        run: npx capacitor-assets generate --android

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PrintZone-PaperCost.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrintZone-PaperCost-apk
          path: PrintZone-PaperCost.apk
