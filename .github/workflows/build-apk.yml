name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Organize files and create config
        run: |
          if [ -d PrintZone-PaperCost ]; then
            cp -r PrintZone-PaperCost/. .
          fi

          mkdir -p www assets
          if [ -f index.html ]; then mv index.html www/index.html; fi
          if [ -f splash.jpg ]; then mv splash.jpg www/splash.jpg; fi
          for f in icon-only icon-foreground icon-background splash splash-dark; do
            if [ -f "$f.png" ]; then mv "$f.png" "assets/$f.png"; fi
          done

          cat > package.json <<'EOF'
          {
            "name": "printzone-papercost",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/core": "^6.1.2",
              "@capacitor/splash-screen": "^6.0.2"
            },
            "devDependencies": {
              "@capacitor/assets": "^3.0.5",
              "@capacitor/cli": "^6.1.2"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.printzone.papercost",
            "appName": "PrintZone-PaperCost",
            "webDir": "www",
            "backgroundColor": "#0b7a35",
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 600,
                "launchAutoHide": true,
                "backgroundColor": "#0b7a35",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false
              }
            }
          }
          EOF

          echo "--- files ---"
          ls -la
          ls -la www assets
          test -f www/index.html || (echo "ERROR: www/index.html nei" && exit 1)
          test -f assets/icon-only.png || (echo "ERROR: assets/icon-only.png nei" && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons and splash
        run: npx capacitor-assets generate --android

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PrintZone-PaperCost.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrintZone-PaperCost-apk
          path: PrintZone-PaperCost.apk
